---
- name: Install Zabbix Agent on Windows hosts
  hosts: windows
  vars:
    zabbix_server: "192.168.1.214"
    zabbix_agent_arch: "amd64"
    zabbix_base_url: "https://cdn.zabbix.com/zabbix/binaries/stable/7.4/"

  tasks:
    - name: Create Temp directory if it doesn't exist
      win_file:
        path: "C:\\Temp"
        state: directory

    - name: Fetch Zabbix 7.4 directory listing
      win_uri:
        url: "{{ zabbix_base_url }}"
        return_content: yes
      register: zabbix_dir_listing

    - name: Extract latest version number
      set_fact:
        zabbix_agent_version: >-
          {{ zabbix_dir_listing.content
            | regex_findall('href="(7\.4\.\d+)/"')
            | list
            | sort(reverse=false)
            | last }}

    - name: Show version that will be installed
      debug:
        msg: "Latest Zabbix agent version found: {{ zabbix_agent_version }}"

    - name: Check if Zabbix Agent 2 is already installed
      win_reg_stat:
        path: HKLM:\SOFTWARE\Zabbix SIA\Zabbix Agent 2
        name: Version
      register: zabbix_installed
      ignore_errors: yes

    - name: Show currently installed version
      debug:
        msg: "Currently installed version: {{ zabbix_installed.value | default('Not installed') }}"

    - name: Download Zabbix Agent 2 installer
      win_get_url:
        url: "{{ zabbix_base_url }}{{ zabbix_agent_version }}/zabbix_agent2-{{ zabbix_agent_version }}-windows-{{ zabbix_agent_arch }}-openssl.msi"
        dest: "C:\\Temp\\zabbix_agent2.msi"
      when: >
        zabbix_installed.exists is not defined or
        zabbix_installed.value is not defined or
        zabbix_installed.value != zabbix_agent_version

    - name: Install Zabbix Agent 2
      win_package:
        path: "C:\\Temp\\zabbix_agent2.msi"
        state: present
        arguments:
          - /quiet
          - "SERVER={{ zabbix_server }}"
          - "SERVERACTIVE={{ zabbix_server }}"
          - "HOSTNAME={{ ansible_fqdn }}"
          - "HOSTMETADATA=Windows"
      when: >
        zabbix_installed.exists is not defined or
        zabbix_installed.value is not defined or
        zabbix_installed.value != zabbix_agent_version
      notify: restart zabbix-agent2

    - name: Ensure Zabbix Agent 2 service is started and enabled
      win_service:
        name: "Zabbix Agent 2"
        state: started
        start_mode: auto

    - name: Open Zabbix agent port in Windows Firewall
      win_firewall_rule:
        name: "Zabbix Agent"
        localport: 10050
        action: allow
        direction: in
        protocol: tcp
        state: present
        enabled: yes

    - name: Clean up installer
      win_file:
        path: "C:\\Temp\\zabbix_agent2.msi"
        state: absent
      ignore_errors: yes

  handlers:
    - name: restart zabbix-agent2
      win_service:
        name: "Zabbix Agent 2"
        state: restarted